name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and Package IPA
      run: |
        mkdir -p Payload
        xcodebuild -project (2) 서버복사기.xcodeproj -scheme 프로젝트이름 -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build
        cp -r build/*.app Payload/
        zip -r App.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: App.ipa
